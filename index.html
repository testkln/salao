<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KBLOS — Salão de Beleza</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

<style>

:root {
    --off-white: #F4F1EC;
    --cream: #E9E3DA;
    --beige: #D6C8B8;
    --beige-strong: #BDA991;
    --warm-gray: #8A837A;
    --warm-gray-light: #C8C1B8;
    --graphite: #353330;
    --dark: #292825;
    --black: #1D1C1A;
    --white: #FFFFFF;
    --border: #CEC7BE;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    background: var(--off-white);
}

body {
    background: var(--off-white);
    color: var(--graphite);
    font-family: "DM Sans", Arial, sans-serif;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}


/* ================= HEADER ================= */

header {
    width: 100%;
    height: 78px;
    padding: 0 6%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    position: sticky;
    top: 0;
    z-index: 1000;

    background: rgba(244, 241, 236, .96);
    backdrop-filter: blur(14px);

    border-bottom: 1px solid var(--border);
}

.brand {
    color: var(--black);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 6px;
}

nav {
    display: flex;
    gap: 32px;

    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

nav a {
    color: var(--graphite);
    transition: .25s;
}

nav a:hover {
    color: var(--beige-strong);
}


/* ================= BOTÕES ================= */

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 14px 24px;

    background: var(--graphite);
    color: var(--white);

    border: 1px solid var(--graphite);

    font-size: 11px;
    font-weight: 500;

    text-transform: uppercase;
    letter-spacing: 1.3px;

    transition: .25s;
}

.btn:hover {
    background: var(--black);
    border-color: var(--black);
    transform: translateY(-2px);
}

.mini {
    padding: 11px 18px;
}


/* ================= HERO ================= */

.hero {
    min-height: calc(100vh - 78px);

    position: relative;

    display: flex;
    align-items: center;

    background:
        url("https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=2000&q=85")
        center / cover no-repeat;

    color: var(--white);
}

.hero::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(29,28,26,.72),
            rgba(29,28,26,.30),
            rgba(29,28,26,.08)
        );
}

.hero-content {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 900px;

    padding: 8%;
}

.hero-label {
    margin-bottom: 22px;

    color: #EEE9E2;

    font-size: 10px;
    font-weight: 600;
    letter-spacing: 3px;
}

.hero h1 {
    margin-bottom: 28px;

    font-family: "Playfair Display", Georgia, serif;

    font-size: clamp(56px, 8vw, 108px);

    font-weight: 500;
    line-height: .96;

    color: #fff;
}

.hero h1 em {
    font-style: italic;
}

.hero-description {
    max-width: 530px;

    margin-bottom: 34px;

    color: #F1ECE5;

    font-size: 18px;
    line-height: 1.65;
}

.hero-actions {
    display: flex;
    align-items: center;
    gap: 28px;
}

.hero .btn {
    background: var(--off-white);
    color: var(--graphite);
    border-color: var(--off-white);
}

.hero .btn:hover {
    background: var(--beige);
    border-color: var(--beige);
}

.hero-link {
    color: #fff;

    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.3px;

    padding-bottom: 5px;

    border-bottom: 1px solid #fff;
}


/* ================= SEÇÕES ================= */

.section {
    padding: 115px 8%;
}

.kicker {
    margin-bottom: 20px;

    color: var(--warm-gray);

    font-size: 10px;
    font-weight: 600;

    letter-spacing: 3px;
    text-transform: uppercase;
}

.section-top {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 60px;

    align-items: end;

    margin-bottom: 70px;
}

.section h2,
.about h2,
.cta h2,
.contact h2 {
    font-family: "Playfair Display", Georgia, serif;

    font-weight: 500;
    line-height: .98;

    color: var(--graphite);
}

.section h2 {
    font-size: clamp(48px, 6vw, 76px);
}

.section h2 em,
.about h2 em,
.cta h2 em,
.contact h2 em {
    font-style: italic;
}

.description {
    max-width: 560px;

    color: var(--warm-gray);

    font-size: 16px;
    line-height: 1.85;
}


/* ================= SERVIÇOS ================= */

.services-section {
    background: var(--cream);
}

.services {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    border: 1px solid var(--border);

    background: var(--off-white);
}

.service {
    min-height: 270px;

    padding: 42px 30px;

    background: var(--off-white);

    border-right: 1px solid var(--border);

    transition: .25s;
}

.service:hover {
    background: var(--beige);
}

.service:last-child {
    border-right: 0;
}

.service-number {
    color: var(--beige-strong);

    font-size: 11px;
    letter-spacing: 1px;
}

.service h3 {
    margin: 50px 0 12px;

    font-family: "Playfair Display", Georgia, serif;

    font-size: 31px;
    font-weight: 500;

    color: var(--graphite);
}

.service p {
    color: var(--warm-gray);

    font-size: 14px;
    line-height: 1.7;
}


/* ================= SOBRE ================= */

.about {
    display: grid;

    grid-template-columns: 1fr 1fr;

    background: var(--off-white);
}

.about-image {
    min-height: 650px;

    background:
        url("https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1300&q=85")
        center / cover no-repeat;
}

.about-content {
    padding: 11%;

    display: flex;
    flex-direction: column;
    justify-content: center;

    background: var(--beige);
}

.about h2 {
    font-size: clamp(48px, 5.5vw, 75px);

    margin-bottom: 30px;
}

.about-content p:not(.kicker) {
    max-width: 520px;

    margin-bottom: 18px;

    color: var(--graphite);

    font-size: 15px;
    line-height: 1.85;
}

.about-content .btn {
    align-self: flex-start;
    margin-top: 12px;
}


/* ================= GALERIA ================= */

.gallery-section {
    background: var(--off-white);
}

.gallery-header {
    text-align: center;
    margin-bottom: 65px;
}

.gallery-header h2 {
    font-size: clamp(48px, 6vw, 76px);
}

.gallery {
    display: grid;

    grid-template-columns: 1.15fr .9fr .9fr;

    gap: 14px;
}

.gallery-item {
    height: 430px;

    position: relative;

    display: flex;
    align-items: flex-end;

    padding: 25px;

    overflow: hidden;

    color: #fff;

    font-family: "Playfair Display", Georgia, serif;

    font-size: 27px;

    background-size: cover;
    background-position: center;
}

.gallery-item::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to top,
            rgba(29,28,26,.58),
            transparent 55%
        );
}

.gallery-item span {
    position: relative;
    z-index: 2;

    color: #fff;
}


/* CORTES */

.gallery-1 {
    background-image:
        url("https://images.unsplash.com/photo-1562322140-8baeececf3df?auto=format&fit=crop&w=1000&q=85");
}


/* TRANSFORMAÇÃO — NOVA FOTO */

.gallery-2 {
    background-image:
        url("https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?auto=format&fit=crop&w=1200&q=85");
}


/* BELEZA */

.gallery-3 {
    background-image:
        url("https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=1000&q=85");
}


/* ================= CTA ================= */

.cta {
    padding: 125px 8%;

    text-align: center;

    background: var(--graphite);

    color: var(--off-white);

    border-top: 1px solid var(--border);
}

.cta .kicker {
    color: var(--beige);
}

.cta h2 {
    color: var(--off-white);

    font-size: clamp(55px, 7vw, 90px);

    margin-bottom: 38px;
}

.cta h2 em {
    color: var(--beige);
}

.cta .btn {
    background: var(--off-white);

    color: var(--graphite);

    border-color: var(--off-white);
}

.cta .btn:hover {
    background: var(--beige);
    border-color: var(--beige);
}


/* ================= CONTATO ================= */

.contact {
    padding: 115px 8%;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 80px;

    background: var(--cream);
}

.contact h2 {
    font-size: clamp(48px, 5.5vw, 75px);
}

.contact-details {
    padding-top: 20px;

    border-top: 1px solid var(--border);
}

.contact-details p {
    margin-bottom: 30px;

    color: var(--warm-gray);

    line-height: 1.7;
}

.contact-details strong {
    color: var(--graphite);

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 2px;
}

.contact-details a {
    color: var(--graphite);
}

.contact-details a:hover {
    color: var(--beige-strong);
}


/* ================= FOOTER ================= */

footer {
    padding: 30px 8%;

    display: flex;

    align-items: center;
    justify-content: space-between;

    background: var(--dark);

    color: var(--warm-gray-light);

    font-size: 12px;
}

footer strong {
    color: var(--off-white);
    letter-spacing: 4px;
}


/* ================= MOBILE ================= */

@media (max-width: 800px) {

    header {
        height: 70px;
        padding: 0 5%;
    }

    .brand {
        font-size: 22px;
    }

    nav {
        display: none;
    }

    .hero {
        min-height: calc(100vh - 70px);
    }

    .hero-content {
        padding: 13% 7%;
    }

    .
